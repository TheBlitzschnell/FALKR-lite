name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A superseded run proves nothing about the tip of the branch, and the
# testcontainers suites are expensive enough that queueing them behind each
# other wastes real minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt / clippy / build / test / coverage
    runs-on: ubuntu-latest
    # The number exists so a hung container run dies in the same hour it
    # started, not after six.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # llvm-tools-preview is what cargo-llvm-cov instruments with.
          components: clippy, rustfmt, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@cargo-llvm-cov

      # These run in CI, not just on someone's laptop — a lint that only fires
      # locally is not enforcing anything.
      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: build
        run: cargo build --workspace

      # Its own step so the failure is legible in the log rather than buried in a
      # test run. It is implemented as a test rather than as a script: the same
      # rule enforced in two places drifts, and the copy that drifts is always the
      # one nobody runs locally.
      - name: every corpus scenario documents its reasoning
        run: cargo test -p falkr-testkit --test corpus -- --exact every_scenario_documents_its_reasoning

      # The golden ledger corpus. Runs before the containerised suites because it
      # needs no Docker and catches a hand-arithmetic slip in a scenario in under
      # a second.
      #
      # The whole corpus is budgeted at two minutes. Compilation is done first and
      # excluded from the measurement, so the budget is on execution — which is
      # the number that grows as scenarios are added.
      - name: golden ledger corpus
        run: |
          set -euo pipefail
          cargo test -p falkr-testkit --no-run
          start=$(date +%s)
          cargo test -p falkr-testkit
          elapsed=$(( $(date +%s) - start ))
          echo "corpus suite executed in ${elapsed}s"
          if [ "$elapsed" -gt 120 ]; then
            echo "::error::the corpus suite took ${elapsed}s against a 120s budget. \
          Split the job or parallelise rather than raising this."
            exit 1
          fi

      # --include-ignored runs the testcontainers suites (real Postgres, real
      # RLS). They are #[ignore] so a laptop without a container runtime stays
      # green; CI has Docker, so here they are mandatory. RLS is a Postgres
      # feature, and a mocked test of it proves nothing.
      #
      # Run under llvm-cov rather than as a separate pass: instrumenting the run
      # we already pay for is free, whereas a second --include-ignored pass would
      # double the container time. --no-report defers rendering to the step below.
      - name: test (unit + testcontainers)
        run: cargo llvm-cov --workspace --no-report -- --include-ignored

      # Doc-tests are not part of `cargo test --workspace` and llvm-cov does not
      # instrument them. Separate step so a broken doc example is its own failure
      # rather than hiding inside the main test run.
      - name: doc tests
        run: cargo test --workspace --doc

      # Gated at 60% lines since the corpus landed.
      #
      # Where the number comes from: line coverage measured on this workspace
      # *without* the testcontainers suites, which could not run on the machine
      # that measured it. CI runs with --include-ignored and therefore covers
      # strictly more, so 60 is a floor CI is guaranteed to clear rather than a
      # target anyone tuned to.
      #
      # It is deliberately a floor and not an aspiration. A gate set at the exact
      # current figure fails on the first refactor that moves a line; a gate set
      # above what is measured is a gate somebody disables the week it fires. The
      # step prints the actual figure, so raise this number to the last observed
      # CI value whenever you touch it — and never lower it to make a red build
      # green.
      - name: coverage
        run: |
          cargo llvm-cov report --summary-only --fail-under-lines 60 | tee coverage.txt
          {
            echo '### Coverage'
            echo
            echo '```'
            cat coverage.txt
            echo '```'
            echo
            echo '_Gated at 60% lines — see the comment in ci.yml._'
          } >> "$GITHUB_STEP_SUMMARY"

  architecture:
    name: dependency direction
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      # Dependencies point inward only. Prose rules get violated under deadline;
      # this one is mechanical.
      - name: inward-only dependency rule
        run: python3 scripts/check-deps.py

      # Proves the domain layer is genuinely persistence-free rather than
      # merely not importing sqlx today.
      - name: domain crates resolve without sqlx
        run: |
          set -euo pipefail
          for c in falkr-core falkr-events \
                   falkr-research-graph falkr-cost-spine; do
            if cargo tree -p "$c" -e normal --prefix none \
                 | awk '{print $1}' | grep -qxE 'sqlx|sea-orm'; then
              echo "::error::$c resolves a persistence crate; see the workspace layout"
              exit 1
            fi
          done
          echo "✓ no domain crate resolves sqlx or sea-orm"

  licenses:
    name: licenses / advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # No toolchain step: cargo-deny-action runs in its own container with its
      # own Rust, and reads Cargo.lock rather than compiling anything.

      # Check the licence of every new dependency before it goes into Cargo.toml,
      # not after. Policy lives in deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources advisories
