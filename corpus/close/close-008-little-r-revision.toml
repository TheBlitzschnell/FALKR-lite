[meta]
id             = "close-008-little-r-revision"
title          = "little-r revision recorded in the current period"
standards      = ["ASC 250-10-45-27", "SAB 108"]
phase          = "P04"
difficulty     = 4

[setup]
entity         = "US_PARENT"
book           = "US_GAAP"
functional_ccy = "USD"
period         = "2026-06"

[[operations]]
kind = "post_entry"
date = "2026-03-31"
description = "Q1 revenue as originally reported"
source = "MANUAL"
lines = [
    { account = "1100-Accounts Receivable", debit = "900000.00" },
    { account = "4000-Revenue", credit = "900000.00" },
]

[[operations]]
kind = "close_period"
date = "2026-04-05"
period = "2026-03"
book = "US_GAAP"

[[operations]]
kind = "revise"
date = "2026-06-30"
period = "2026-06"
book = "US_GAAP"
classification = "LITTLE_R"
origin_period = "2026-03"
description = "Immaterial cutoff error identified in the Q2 review"
amount = "9000.00"

[expected.trial_balance]
"1100-Accounts Receivable"                   = "891000.00"
"4000-Revenue"                               = "-891000.00"

[expected.invariants]
balanced                 = true
replay_stable            = true
subledger_ties           = false
roll_forward             = false
intercompany_eliminated  = false

[expected.notes]
reasoning = """
The same *type* of error as close-007 and a different size: 9,000.00, or 1% of
quarterly revenue, with no qualitative factor making it material — it does not
change a trend, does not affect a covenant, and does not turn a loss into a
profit.

Under SAB 108, an error that is immaterial to both the prior period and the
current period is corrected as a **revision**: the correction is recorded in the
current period, prior-period statements are not reissued, and the revision is
disclosed the next time the prior period is presented.

  Q1 as reported          900,000.00, and it stays reported at 900,000.00
  Revision in Q2            9,000.00
  Cumulative revenue      891,000.00

The trial balance above is the cumulative position after the revision, which is
why it looks like close-007's with a different number. The difference between the
two scenarios is not visible in the ending balance at all — it is in *which
period the correction was recorded in* and *whether the prior period's issued
figures changed*.

That is exactly why the classification is a field on the entry rather than a
memo. Two entries with identical debits and credits, distinguished only by
`BIG_R` versus `LITTLE_R`, have completely different consequences for what has to
be filed, and a ledger that cannot tell them apart cannot support either.

Deferred to P04.
"""
