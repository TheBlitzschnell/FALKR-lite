# Journal sources, in the AICPA ADS sense: the subsystem an entry came from.
#
# `automated = false` is the population AS 2401 asks about first. Recording it
# on the source rather than deriving it per entry is what makes "show me every
# manual journal entry over $50,000 posted after period end" a query rather than
# a project.

