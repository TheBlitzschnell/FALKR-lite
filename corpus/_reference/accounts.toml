# The corpus chart of accounts.
#
# Data, not Rust. Every account any scenario may reference lives here; a
# scenario naming an account that is not in this file fails validation, which is
# how a typo in an account name becomes a test failure instead of a silently
# created account.
#
# Fields
#   code                 numeric account number, unique
#   name                 exact name; scenarios may write "1000-Cash" and the
#                        name is checked, not merely accepted
#   kind                 asset | liability | equity | revenue | expense
#   contra               true if the account carries the opposite side to its
#                        kind (accumulated depreciation, the CECL allowance)
#   allow_opposite_sign  overrides the per-kind default in invariant 4
#   currency             restricts the account to one currency; omit for
#                        functional-currency accounts
#   subledger            names the subledger this account is the control
#                        account for; invariant 7 ties them
#   intercompany         true if invariant 10 must see it net to zero
#   fs_caption           the financial-statement line it rolls into
#
# Numbering
#   1xxx assets  2xxx liabilities  3xxx equity  4xxx revenue
#   5xxx cost of revenue  6xxx operating expense  7xxx other income/expense
#   8xxx income tax  9xxx elimination and clearing

