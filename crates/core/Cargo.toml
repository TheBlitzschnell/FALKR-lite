[package]
name = "falkr-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Domain types and traits. Depends on nothing else in this workspace."

[features]
default = []
# Enables `sqlx::Type` derives on the domain-ID newtypes. Off by default so that
# `core` and every domain crate resolve without sqlx (the workspace layout,
# the inward-only dependency rule); `infra` is the only crate that turns this on.
sqlx = ["dep:sqlx"]

[dependencies]
chrono.workspace = true
rust_decimal.workspace = true
serde.workspace = true
thiserror.workspace = true
uuid.workspace = true
sqlx = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
rust_decimal_macros.workspace = true
serde_json.workspace = true
